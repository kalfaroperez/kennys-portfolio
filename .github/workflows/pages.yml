name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # GitHub Pages only serves static files, so publish the frontend plus the JSON it reads.
      - name: Assemble static site
        run: |
          mkdir _site
          cp src/Portfolio.Api/wwwroot/index.html _site/
          cp src/Portfolio.Api/wwwroot/styles.css _site/
          cp src/Portfolio.Api/wwwroot/app.js _site/
          cp src/Portfolio.Api/Data/portfolio.json _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
